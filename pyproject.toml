[project]
name = "stormy-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arm-pyart>=2.2.5",
    "cartopy>=0.25.0",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.47.0",
    "h5netcdf>=1.8.1",
    "herbie-data>=2026.3.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.10",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.11.1",
    "metpy>=1.7.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "s3fs>=2026.7.0",
    "scipy>=1.18.0",
    "siphon>=0.11.0",
     "xarray>=2026.7.0",
     "langsmith>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormy_ai"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "pytest>=9.1.1",
]
