# Runs on merge (push) to main. Path filters decide docker vs infra jobs.
# Jobs use the GitHub Environment "prod" (Settings → Environments → prod).
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_NAME: wx_briefing_agent

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'main.py'
              - 'config.yaml'
              - 'README.md'
              - 'src/**'
              - 'tests/**'
            infra:
              - 'infra/**'
              - 'Makefile'

  push_image:
    name: Build and push image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    # Native arm64 — ECS is ARM64; avoid slow QEMU emulation on amd64 runners.
    runs-on: ubuntu-24.04-arm
    environment: prod
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check AWS secrets
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SECRET" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::AWS secrets are empty in the 'prod' environment."
            echo "Confirm they exist under Settings → Environments → prod → Environment secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          cache-from: type=gha,scope=wx-briefing-agent
          cache-to: type=gha,mode=max,scope=wx-briefing-agent

  infra:
    name: Apply infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_TRACING_ENABLED: ${{ secrets.LANGSMITH_TRACING }}
    steps:
      - uses: actions/checkout@v5

      - name: Check AWS secrets
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SECRET" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::AWS secrets are empty in the 'prod' environment."
            echo "Confirm they exist under Settings → Environments → prod → Environment secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: make infra-init

      - name: Terraform plan
        run: make infra-plan

      - name: Terraform apply
        run: make infra-apply
