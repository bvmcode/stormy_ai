# Runs on merge (push) to main. Path filters decide docker vs infra jobs.
#
# Secrets must be Repository secrets (Settings → Secrets and variables → Actions),
# or Environment secrets whose name matches jobs.*.environment below.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'main.py'
              - 'config.yaml'
              - 'README.md'
              - 'src/**'
              - 'tests/**'
            infra:
              - 'infra/**'
              - 'Makefile'

  test_and_push:
    name: Test and push image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_TRACING_ENABLED: ${{ secrets.LANGSMITH_TRACING }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: make test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check AWS secrets
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SECRET" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and/or AWS_ACCOUNT_ID are empty."
            echo "Add them under Settings → Secrets and variables → Actions → Repository secrets."
            echo "Environment secrets are only visible when the job sets environment: <exact-name>."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Build and push image
        run: make build_and_push

  infra:
    name: Apply infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_TRACING_ENABLED: ${{ secrets.LANGSMITH_TRACING }}
    steps:
      - uses: actions/checkout@v5

      - name: Check AWS secrets
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SECRET" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and/or AWS_ACCOUNT_ID are empty."
            echo "Add them under Settings → Secrets and variables → Actions → Repository secrets."
            echo "Environment secrets are only visible when the job sets environment: <exact-name>."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: make infra-init

      - name: Terraform plan
        run: make infra-plan

      - name: Terraform apply
        run: make infra-apply
